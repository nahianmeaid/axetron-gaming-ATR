<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gear & Apparel - Axetron Gaming</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      margin: 0;
    }

    header {
      padding: 20px;
      background: #000;
      text-align: center;
      border-bottom: 1px solid #f1c40f33;
    }

    header h1 {
      color: #f1c40f;
    }

    .hero {
      background: url('gear-bg.jpg') center/cover no-repeat;
      height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      top: 0; left: 0;
    }

    .hero h2 {
      position: relative;
      color: #f1c40f;
      font-size: 40px;
      z-index: 1;
      animation: fadeInUp 1.5s ease;
    }

    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .gear-grid {
      max-width: 1000px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 0 20px;
    }

    .gear-card {
      background: #111;
      border: 1px solid #f1c40f22;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
      transition: 0.3s;
    }

    .gear-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #f1c40f55;
    }

    .gear-card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .gear-card h4 {
      color: #f1c40f;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      color: #aaa;
      font-size: 14px;
      border-top: 1px solid #f1c40f33;
    }
  </style>
</head>
<body>

  <header>
    <h1>AXETRON GAMING</h1>
  </header>

  <section class="hero">
    <h2>Gear & Apparel</h2>
  </section>

  <div class="gear-grid">
    <div class="gear-card">
      <img src="img/jersey.png" alt="ATR Jersey" />
      <h4>Official Jersey</h4>
    </div>
    <div class="gear-card">
      <img src="img/hoodie.png" alt="ATR Hoodie" />
      <h4>Limited Hoodie</h4>
    </div>
    <div class="gear-card">
      <img src="img/mousepad.png" alt="Mousepad" />
      <h4>Mousepad - ATR Ed.</h4>
    </div>
  </div>

  <footer>&copy; 2025 Axetron Gaming</footer>
</body>
</html>
