<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partners - Axetron Gaming</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #000, #111);
      color: #f5f5f5;
    }

    header {
      background: #000;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1c40f33;
    }

    header h1 {
      font-size: 22px;
      color: #f1c40f;
    }

    .hero {
      background: url('partner-bg.jpg') center/cover no-repeat;
      height: 50vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
    }

    .hero h2 {
      position: relative;
      color: #f1c40f;
      font-size: 38px;
      z-index: 1;
      animation: slideIn 1.5s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .partners-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
    }

    .partner-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #f1c40f22;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s;
      backdrop-filter: blur(4px);
    }

    .partner-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 12px #f1c40f44;
    }

    .partner-card img {
      max-width: 100px;
      height: auto;
      margin-bottom: 10px;
    }

    .partner-card h4 {
      color: #f1c40f;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      color: #aaa;
      font-size: 14px;
      border-top: 1px solid #f1c40f33;
    }
  </style>
</head>
<body>

  <header>
    <h1>AXETRON GAMING</h1>
  </header>

  <section class="hero">
    <h2>Our Partners</h2>
  </section>

  <div class="partners-container">
    <div class="partner-card">
      <img src="img/partner1.png" alt="Partner 1" />
      <h4>EnergyX</h4>
      <p>Official Energy Drink</p>
    </div>
    <div class="partner-card">
      <img src="img/partner2.png" alt="Partner 2" />
      <h4>HawkGear</h4>
      <p>Gaming Apparel</p>
    </div>
    <div class="partner-card">
      <img src="img/partner3.png" alt="Partner 3" />
      <h4>FlexZone</h4>
      <p>Streaming Partner</p>
    </div>
    <div class="partner-card">
      <img src="img/partner4.png" alt="Partner 4" />
      <h4>NovaTech</h4>
      <p>Device Sponsor</p>
    </div>
  </div>

  <footer>
    &copy; 2025 Axetron Gaming — All rights reserved.
  </footer>

</body>
</html>
